<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E6B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A1A3E;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#g)"/>
  <!-- Skyline Frankfurt simplificada -->
  <rect x="100" y="220" width="30" height="110" fill="#fff" opacity="0.12"/>
  <rect x="140" y="200" width="25" height="130" fill="#fff" opacity="0.12"/>
  <rect x="175" y="180" width="35" height="150" fill="#fff" opacity="0.15"/>
  <rect x="220" y="160" width="40" height="170" fill="#fff" opacity="0.18"/>
  <rect x="270" y="140" width="20" height="190" fill="#fff" opacity="0.2"/>
  <!-- Torre com antena -->
  <rect x="290" y="100" width="4" height="40" fill="#fff" opacity="0.5"/>
  <rect x="310" y="170" width="35" height="160" fill="#fff" opacity="0.18"/>
  <rect x="355" y="185" width="30" height="145" fill="#fff" opacity="0.15"/>
  <rect x="395" y="200" width="40" height="130" fill="#fff" opacity="0.12"/>
  <rect x="445" y="215" width="30" height="115" fill="#fff" opacity="0.1"/>
  <!-- Linha base -->
  <rect x="80" y="330" width="440" height="4" fill="#fff" opacity="0.2"/>
  <!-- Estrelas -->
  <circle cx="80" cy="60" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="150" cy="40" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="480" cy="50" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="520" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="50" cy="100" r="1.5" fill="#fff" opacity="0.5"/>
  <!-- Texto -->
  <text x="300" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#fff" opacity="0.95">Frankfurt</text>
  <text x="300" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff" opacity="0.7">Frankfurt ’ São Paulo</text>
  <text x="300" y="155" text-anchor="middle" font-size="22" fill="#fff" opacity="0.7"></text>
